<!DOCTYPE html>
<html>
<head>
    <title>The Game Room</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <!-- The game room area -->
    <div id="game-room-area">

        <!-- The game room start page -->
        <div id="game-room-start-page">
            <div class="row">
                <div class="col">
                    <div class="title">The Game Room</div>
                    <div class="row">
                        <button id="start-signin-button">Sign In</button>
                        <button id="start-register-button">Register</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- The game room register page -->
        <div id="game-room-register-page" style="display: none">
            <div class="row">
                <form id="register-form" class="col">
                    <div class="subtitle">Register</div>
                    <input id="register-username" maxlength="10" placeholder="Enter your username"></input>
                    <select id="register-avatar">
                        <option class="placeholder" value="">Select your avatar</option>
                    </select>
                    <input id="register-name" maxlength="16" placeholder="Enter your name"></input>
                    <input id="register-password" type="password" placeholder="Enter your password"></input>
                    <input id="register-confirm" type="password" placeholder="Enter your password again"></input>
                    <div class="row">
                        <button id="register-button" type="submit">Register</button>
                        <button class="back-button" type="button">Back</button>
                    </div>
                    <div id="register-message" class="message"></div>
                </form>
            </div>
        </div>

        <!-- The game room signin page -->
        <div id="game-room-signin-page" style="display: none">
            <div class="row">
                <form id="signin-form" class="col">
                    <div class="subtitle">Sign In</div>
                    <input id="signin-username" placeholder="Enter your username"></input>
                    <input id="signin-password" type="password" placeholder="Enter your password"></input>
                    <div class="row">
                        <button id="signin-button" type="submit">Sign In</button>
                        <button class="back-button" type="button">Back</button>
                    </div>
                    <div id="signin-message" class="message"></div>
                </form>
            </div>
        </div>

        <!-- The before-joining-page -->
        <!-- after player login/validate, they see this page, -->
        <!--
        This page is the page,
        where player press "Join Game" button
        to join Match-Making
        -->        
        <div id="before-joining-page" style="display: none">
            <div class="row">
                <div class="col">
                    <div class="title">
                        Hello
                        <span id="game-room-user-avatar">avatar</span>
                        <span id="game-room-user-name">name</span>!
                    </div>
                    <form id="join-game-form" class="col">
                        <div class="row"><button id="join-game-button" type="submit">Join a Game!</button></div>
                        <div class="row" id = "join-message">joining response appears here!</div>
                    </form>
                    <form id="signout-form" class="col">
                        <div class="row"><button id="signout-button" type="submit">Sign Out</button></div>
                    </form>
                </div>
            </div>
        </div>

        <!-- The match-making page -->
        <!-- Shown after the player presses "Join Game" -->
        <div id="match-making-page" style="display: none">
            <div class="row">
                <div class="col">
                    <div class="title">Match-Making</div>
                    <div class="row">
                        <div class="spinner"></div>
                    </div>
                    <div class="row">
                        <div id="match-making-message" class="message">
                            Waiting for opponents...
                        </div>
                    </div>

                    <div class="row">
                        <div class="message">
                            Current Players Waiting: You
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- the page where player ACTUALLY plays the game -->
        <div id="timberman-game-page" style="display: none">
            <div class = "title">Im Game page</div>
            <div class = "title" id = "player-tree"></div>
            <div class = "title" id = "player-bomb">No Bomb</div>
            <div class = "title" id = "opponent-tree"></div>
            <div class = "title" id = "opponent-bomb">No Bomb</div>
        </div>

        <!-- this page shows scores for players after game-over -->
        <div id="game-over-page" style="display: none">
            <div class = "title">Im Game-Over page</div>
            <div class = "title" id = "game-over-message">You (Win/Lose)!!!</div>
            <div class = "title">Your Score: <span id = "player-score">not Initialized</span></div>
            <div class = "title">Opponent's Score: <span id = "opponent-score">not Initialized</span></div>

            <form id="play-again-form" class="col">
                <div class="row"><button id="play-again-button" type="submit">Play Again!</button></div>
            </form>
            <form id="game-over-logout-form" class="col">
                <div class="row"><button id="game-over-logout-button" type="submit">Log Out</button></div>
            </form>

        </div>

    </div>

    <!-- JavaScript files for the game room -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="scripts/avatar.js"></script>
    <script src="scripts/game.js"></script>

    <!-- Initialize the game room -->
    <script>
    $(function() {
        // Initialize the game room functionalities
        GameRoom.init();

        // Validate the log in
        GameRoom.validate();
    });
    </script>
</body>
</html>
